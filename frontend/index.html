<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Mirador · Recepción</title>
  <!-- base: variables, reset y tipografía -->
  <link rel="stylesheet" href="blocks/base.css">
  <!-- un archivo por bloque (BEM) -->
  <link rel="stylesheet" href="blocks/header.css">
  <link rel="stylesheet" href="blocks/tabs.css">
  <link rel="stylesheet" href="blocks/page.css">
  <link rel="stylesheet" href="blocks/panel.css">
  <link rel="stylesheet" href="blocks/form.css">
  <link rel="stylesheet" href="blocks/input.css">
  <link rel="stylesheet" href="blocks/button.css">
  <link rel="stylesheet" href="blocks/table.css">
  <link rel="stylesheet" href="blocks/badge.css">
  <link rel="stylesheet" href="blocks/message.css">
</head>
<body>
  <header class="header">
    <h1 class="header__title">Hotel Mirador</h1>
    <p class="header__subtitle">Sistema de recepción</p>
    <nav class="tabs">
      <button type="button" class="tabs__button tabs__button--active" data-tab="reservations">Reservas</button>
      <button type="button" class="tabs__button" data-tab="rooms">Habitaciones</button>
      <button type="button" class="tabs__button" data-tab="guests">Huéspedes</button>
    </nav>
  </header>

  <main class="page">
    <div id="msg" class="message" hidden></div>

    <!-- RESERVAS -->
    <section id="tab-reservations" data-tab-panel>
      <div class="panel">
        <h2 class="panel__title panel__title--spaced">Nueva reserva</h2>
        <form id="reservation-form" class="form">
          <label class="form__label">Habitación
            <select class="input" name="room_id" id="reservation-room" required></select>
          </label>
          <label class="form__label">Huésped
            <select class="input" name="guest_id" id="reservation-guest" required></select>
          </label>
          <label class="form__label">Ingreso
            <input class="input" type="date" name="check_in" required>
          </label>
          <label class="form__label">Salida
            <input class="input" type="date" name="check_out" required>
          </label>
          <label class="form__label">Personas
            <input class="input" type="number" name="guests_count" min="1" value="1" required>
          </label>
          <button type="submit" class="button">Reservar</button>
        </form>
      </div>

      <div class="panel">
        <div class="panel__head">
          <h2 class="panel__title">Reservas</h2>
          <select class="input" id="reservation-filter">
            <option value="">Todas</option>
            <option value="confirmed">Confirmadas</option>
            <option value="checked_in">Hospedados</option>
            <option value="checked_out">Finalizadas</option>
            <option value="cancelled">Canceladas</option>
          </select>
        </div>
        <table class="table">
          <thead>
            <tr>
              <th class="table__heading">#</th>
              <th class="table__heading">Hab.</th>
              <th class="table__heading">Huésped</th>
              <th class="table__heading">Ingreso</th>
              <th class="table__heading">Salida</th>
              <th class="table__heading">Noches</th>
              <th class="table__heading">Personas</th>
              <th class="table__heading">Total (Bs)</th>
              <th class="table__heading">Estado</th>
              <th class="table__heading"></th>
            </tr>
          </thead>
          <tbody id="reservations-body"></tbody>
        </table>
      </div>
    </section>

    <!-- HABITACIONES -->
    <section id="tab-rooms" data-tab-panel hidden>
      <div class="panel">
        <h2 class="panel__title panel__title--spaced">Nueva habitación</h2>
        <form id="room-form" class="form">
          <label class="form__label">Número <input class="input" name="number" required></label>
          <label class="form__label">Tipo
            <select class="input" name="type">
              <option value="single">Simple</option>
              <option value="double">Doble</option>
              <option value="family">Familiar</option>
              <option value="suite">Suite</option>
            </select>
          </label>
          <label class="form__label">Precio por noche (Bs) <input class="input" type="number" name="price_per_night" min="1" required></label>
          <label class="form__label">Capacidad <input class="input" type="number" name="capacity" min="1" value="2" required></label>
          <button type="submit" class="button">Guardar</button>
        </form>
      </div>

      <div class="panel">
        <h2 class="panel__title panel__title--spaced">Habitaciones</h2>
        <table class="table">
          <thead>
            <tr>
              <th class="table__heading">Número</th>
              <th class="table__heading">Tipo</th>
              <th class="table__heading">Precio</th>
              <th class="table__heading">Capacidad</th>
              <th class="table__heading">Estado</th>
              <th class="table__heading"></th>
            </tr>
          </thead>
          <tbody id="rooms-body"></tbody>
        </table>
      </div>
    </section>

    <!-- HUÉSPEDES -->
    <section id="tab-guests" data-tab-panel hidden>
      <div class="panel">
        <h2 class="panel__title panel__title--spaced">Nuevo huésped</h2>
        <form id="guest-form" class="form">
          <label class="form__label">Nombre completo <input class="input" name="full_name" required></label>
          <label class="form__label">Email <input class="input" type="email" name="email" required></label>
          <label class="form__label">Documento <input class="input" name="document" required></label>
          <button type="submit" class="button">Guardar</button>
        </form>
      </div>

      <div class="panel">
        <h2 class="panel__title panel__title--spaced">Huéspedes</h2>
        <table class="table">
          <thead>
            <tr>
              <th class="table__heading">Nombre</th>
              <th class="table__heading">Email</th>
              <th class="table__heading">Documento</th>
              <th class="table__heading"></th>
            </tr>
          </thead>
          <tbody id="guests-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
